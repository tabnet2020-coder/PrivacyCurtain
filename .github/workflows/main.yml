name: Build Privacy Curtain APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Prepare Project Structure & Gradle Files
        run: |
          # توحيد المسارات إذا كانت الملفات داخل مجلد PrivacyCurtain الفرعي
          if [ -d "PrivacyCurtain/app/src/main" ] && [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            mkdir -p app/src
            cp -r PrivacyCurtain/app/src/main app/src/
          fi

          # إزالة خاصية package القديمة من AndroidManifest لتجنب خطأ AGP 8+
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/package="com.tabony.privacycurtain"//g' app/src/main/AndroidManifest.xml
          fi

          # توليد settings.gradle بدون مشكلة المسافات
          printf 'pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nrootProject.name = "PrivacyCurtain"\ninclude ":app"\n' > settings.gradle

          # توليد build.gradle الرئيسي
          printf 'plugins {\n    id "com.android.application" version "8.2.2" apply false\n    id "org.jetbrains.kotlin.android" version "1.9.22" apply false\n}\n' > build.gradle

          # توليد gradle.properties
          printf 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nkotlin.code.style=official\nandroid.nonTransitiveRClass=true\n' > gradle.properties

          # توليد app/build.gradle
          mkdir -p app
          printf 'plugins {\n    id "com.android.application"\n    id "org.jetbrains.kotlin.android"\n}\nandroid {\n    namespace "com.tabony.privacycurtain"\n    compileSdk 34\n    defaultConfig {\n        applicationId "com.tabony.privacycurtain"\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName "1.0"\n    }\n    buildTypes {\n        debug {\n            minifyEnabled false\n        }\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = "17"\n    }\n}\ndependencies {\n    implementation "androidx.core:core-ktx:1.12.0"\n    implementation "androidx.appcompat:appcompat:1.6.1"\n}\n' > app/build.gradle

      - name: 5. Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 6. Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 7. Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Privacy-Curtain-APK
          path: app/build/outputs/apk/debug/app-debug.apk
